{% if calendarEvent.calendar %}
{% assign googleLinks = calendarEvent | googleCalendarLinks: site.url %}
{% assign outlookLinks = calendarEvent | outlookCalendarLinks: site.url %}
{% for link in googleLinks %}<a class="button" href="{{ link.url | escape }}" target="_blank" rel="noopener noreferrer" title="{{ link.label | escape }}" aria-label="Add {{ calendarEvent.title | escape }} to {{ link.label | escape }} (opens in a new tab)"><i class="fa fa-google" aria-hidden="true"></i></a>{% endfor %}
{% for link in outlookLinks %}<a class="button" href="{{ link.url | escape }}" target="_blank" rel="noopener noreferrer" title="{{ link.label | escape }}" aria-label="Add {{ calendarEvent.title | escape }} to {{ link.label | escape }} (opens in a new tab)"><i class="fa fa-windows" aria-hidden="true"></i></a>{% endfor %}
<a class="button" href="/calendars/{{ calendarEvent.slug }}.ics" download title="Apple / Other Calendar (.ics)" aria-label="Add {{ calendarEvent.title | escape }} to Apple or another calendar (download .ics)"><i class="fa fa-calendar-plus-o" aria-hidden="true"></i></a>
{% endif %}
