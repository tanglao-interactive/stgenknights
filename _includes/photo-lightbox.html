<dialog class="photo-lightbox" aria-labelledby="photo-lightbox-title">
    <div class="photo-lightbox-panel">
        <button class="photo-lightbox-close" type="button" aria-label="Close full-size photo"><i class="fa fa-times" aria-hidden="true"></i></button>
        <button class="photo-lightbox-nav photo-lightbox-previous" type="button" aria-label="View previous photo"><i class="fa fa-chevron-left" aria-hidden="true"></i></button>
        <img class="photo-lightbox-image" src="" alt="">
        <button class="photo-lightbox-nav photo-lightbox-next" type="button" aria-label="View next photo"><i class="fa fa-chevron-right" aria-hidden="true"></i></button>
        <div class="photo-lightbox-caption">
            <h2 id="photo-lightbox-title"></h2>
            <p></p>
            <span class="photo-lightbox-position" aria-live="polite"></span>
        </div>
    </div>
</dialog>
